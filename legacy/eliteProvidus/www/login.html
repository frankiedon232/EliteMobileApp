<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />

    <link rel="apple-touch-icon" href="img/f7-icon-square.html" />
    <link rel="icon" href="img/f7-icon.html" />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="vendor/bootstrap-4.1.3/css/bootstrap.min.css"
    />

    <!-- Material design icons CSS -->
    <link rel="stylesheet" href="vendor/materializeicon/material-icons.css" />

    <!-- app CSS -->
    <link id="theme" rel="stylesheet" href="css/style.css" type="text/css" />
    <link id="theme" rel="stylesheet" href="css/custome.css" type="text/css" />
    <link
      id="theme"
      rel="stylesheet"
      href="css/sweetalert.css"
      type="text/css"
    />

    <title>EliteProvidus</title>
  </head>

  <body class="color-theme-blue">
    <div class="loader justify-content-center">
      <div class="maxui-roller align-self-center">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <div class="wrapper">
      <!-- page main start -->
      <div class="page">
        <div class="background theme-header">
          <img src="img/city2.png" alt="" />
        </div>
        <div class="page-content h-100">
          <center>
            <img src="img/ellite.png" alt="" class="login-logo" />
          </center>
          <br /><br />
          <div class="row mt-5 mx-0 h-100-- justify-content-center">
            <div
              class="col-12 col-md-12 col-lg-12 my-3 mx-auto text-center align-self-center"
            >
              <h5 class="mb-4" style="text-align: left; color: #fcb815">
                WELCOME!
              </h5>
              <div class="login-input-content">
                <div class="form-group">
                  <input
                    type="text"
                    id="username"
                    class="form-control add-height"
                    placeholder="Username"
                  />
                </div>
                <div class="form-group">
                  <input
                    type="password"
                    id="userpass"
                    class="form-control add-height"
                    placeholder="Password"
                  />
                </div>
                <button
                  onclick="login()"
                  class="btn btn-block df-danger btn-lg border-0 z-3 add-height"
                >
                  Sign In <i class="material-icons">arrow_forward</i>
                </button>
              </div>
            </div>
          </div>

          <div class="footer-wrapper shadow-15" id="hide-on-active--">
            <div class="footer dark">
              <div class="row mx-0">
                <div class="col text-center">
                  <span class="float-left mk-mg-dw">&copy; 2021</span>
                  <span
                    ><img src="img/icons/tando.png" class="resize-ft-logo"
                  /></span>
                  <span class="float-right mk-mg-dw">All Rights Reserved</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- page main ends -->
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="js/index.js"></script>
    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="vendor/bootstrap-4.1.3/js/bootstrap.min.js"></script>
    <script src="js/sweetalert.min.js"></script>

    <script src="js/app.js"></script>
    <script src="js/appjq.js"></script>

    <!-- page specific script -->
    <script src="js/no-zoom.js"></script>
    <script>
      $("#username").on("click", function () {
        $("#hide-on-active").css("display", "none");
      });
      $("#userpass").on("click", function () {
        $("#hide-on-active").css("display", "none");
      });

      $(window).on("load", function () {
        // $('.loader').remove();
        $(".loader").hide();
      });

      check_visited_logged();
    </script>
  </body>
</html>
